[package]
name = "vivelite-wine"
description = "Safe wrapper around Wine's embedded C API for vivelite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wine-sys = { package = "vivelite-wine-sys", path = "../wine-sys", version = "0.1.1", optional = true }

[features]
# Enable to link against libwine (propagates to wine-sys). Without it, only
# the pure-Rust parts of this crate (prefix management, path mapping) build
# and test.
link = ["dep:wine-sys", "wine-sys/link"]

[lib]
name = "wine"

[lints]
workspace = true
