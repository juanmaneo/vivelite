[package]
name = "vivelite-monado"
description = "Safe wrapper around the OpenXR loader: runtime probes and the overlay's session/swapchain path"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
monado-sys = { package = "vivelite-monado-sys", path = "../monado-sys", version = "0.1.1" }

[features]
# Enable to link against the OpenXR loader (propagates to monado-sys).
link = ["monado-sys/link"]

[lib]
name = "monado"

[lints]
workspace = true
