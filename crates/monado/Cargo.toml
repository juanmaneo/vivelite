[package]
name = "monado"
description = "Safe wrapper around the OpenXR loader for Monado on-device probes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
monado-sys = { path = "../monado-sys" }

[features]
# Enable to link against the OpenXR loader (propagates to monado-sys).
link = ["monado-sys/link"]
