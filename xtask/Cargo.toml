[package]
name = "vivelite-xtask"
description = "vivelite build orchestrator: fetch / verify / extract / stage / doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bundle = { package = "vivelite-bundle", path = "../crates/bundle", version = "0.1.1" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11"] }
device-ui = { package = "vivelite-device-ui", path = "../crates/device-ui", version = "0.1.1" }
hcf = { package = "vivelite-hcf", path = "../crates/hcf", version = "0.1.1" }
gfr = { package = "vivelite-gfr", path = "../crates/gfr", version = "0.1.1" }
vivelite-core = { path = "../crates/core", version = "0.1.1" }

[dev-dependencies]
egui_kittest = { version = "0.37", default-features = false, features = ["eframe"] }
tempfile = "3"

[lib]
name = "xtask"

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true
