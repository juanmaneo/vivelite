[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/vivelite-core",
    "crates/bundle",
    "crates/wine-sys",
    "crates/wine",
    "crates/fex-sys",
    "crates/fex",
    "crates/monado-sys",
    "crates/monado",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/juanmaneo/vivelite"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
strip = true
