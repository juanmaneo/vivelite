[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/core",
    "crates/eye",
    "crates/device-ui",
    "crates/bundle",
    "crates/hcf",
    "crates/gfr",
    "crates/wine-sys",
    "crates/wine",
    "crates/fex-sys",
    "crates/fex",
    "crates/monado-sys",
    "crates/monado",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/juanmaneo/vivelite"

[workspace.lints.rust]
# Every warning in a workspace crate is an error; a warning must be either
# fixed or explicitly allowed with a written reason at the offending site.
warnings = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
# Local fork of cryoglyph 0.1.0 that accepts lru 0.18 (fixes RUSTSEC-2026-0253).
# Remove once an upstream cryoglyph release allows a patched lru.
cryoglyph = { path = "third_party/cryoglyph" }
